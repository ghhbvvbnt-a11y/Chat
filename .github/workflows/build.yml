name: Android CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q notchat-phase1.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests and debug APK
        working-directory: notchat
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: notchat-debug-apk
          path: notchat/app/build/outputs/apk/debug/app-debug.apk
